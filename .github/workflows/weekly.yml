name: Weekly FX report

on:
  schedule:
    # UTC 03:30 週五 = 台北時間週五 11:30（GitHub 排程可能延遲數分鐘到數十分鐘）
    - cron: "30 3 * * 5"
  workflow_dispatch: {}   # 允許手動觸發，方便測試

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate report (7 API calls, may take several minutes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_report.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html fx_flow_weekly_grounding.json
          git diff --cached --quiet && echo "內容無變化，跳過 commit" && exit 0
          git commit -m "weekly update $(date -u +%F)"
          git push
